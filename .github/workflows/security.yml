name: Dependency Security

on:
  push:
    paths:
      - ".github/workflows/security.yml"
      - "apps/api/**"
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - "apps/web/Dockerfile"
      - "deploy/**"
      - "Makefile"
  pull_request:
    paths:
      - ".github/workflows/security.yml"
      - "apps/api/**"
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - "apps/web/Dockerfile"
      - "deploy/**"
      - "Makefile"
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Pull Request Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  configuration:
    name: Container Configuration Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate production Compose configuration
        run: docker compose -f deploy/docker-compose.yml config --quiet
        env:
          AUTH_TOKEN_SECRET: configuration-validation-only
      - name: Validate load-test Compose configuration
        run: docker compose -f deploy/docker-compose.load.yml config --quiet
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  go-vulnerabilities:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  frontend-dependencies:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm audit --audit-level=high
