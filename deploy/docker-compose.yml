name: url-shortener

services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: url-shortener-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      BASE_URL: http://localhost:8080
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: url_shortener
      MONGODB_URLS_COLLECTION: urls
      SHORT_CODE_LENGTH: 7
      SHORT_CODE_MAX_RETRIES: 5
      REDIRECT_STATUS: 302
      LOG_LEVEL: info
      LOG_FORMAT: json
      REQUEST_TIMEOUT: 10s
      SHUTDOWN_TIMEOUT: 10s

  mongodb:
    image: mongo:7.0
    container_name: url-shortener-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: url_shortener
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:
