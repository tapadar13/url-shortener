name: url-shortener

services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: url-shortener-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      BASE_URL: http://localhost:8080
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: url_shortener
      MONGODB_URLS_COLLECTION: urls
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: url-shortener
      REDIS_CONNECT_TIMEOUT: 5s
      SHORT_CODE_LENGTH: 7
      SHORT_CODE_MAX_RETRIES: 5
      REDIRECT_STATUS: 302
      REDIRECT_CACHE_ENABLED: "true"
      REDIRECT_CACHE_TTL: 10m
      REDIRECT_CACHE_ACCESS_WORKERS: 2
      REDIRECT_CACHE_ACCESS_QUEUE_SIZE: 1024
      REDIRECT_CACHE_ACCESS_TIMEOUT: 5s
      LOG_LEVEL: info
      LOG_FORMAT: json
      REQUEST_TIMEOUT: 10s
      SHUTDOWN_TIMEOUT: 10s

  mongodb:
    image: mongo:7.0
    container_name: url-shortener-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: url_shortener
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: url-shortener-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  mongodb_data:
