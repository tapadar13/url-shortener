name: url-shortener

services:
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: url-shortener-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://api:8080
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: url-shortener-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      BASE_URL: http://localhost:8080
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: url_shortener
      MONGODB_URLS_COLLECTION: urls
      MONGODB_USERS_COLLECTION: users
      MONGODB_SESSIONS_COLLECTION: sessions
      MONGODB_RATE_LIMITS_COLLECTION: rate_limits
      MONGODB_ANALYTICS_COLLECTION: click_analytics
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: url-shortener
      REDIS_CONNECT_TIMEOUT: 5s
      SHORT_CODE_LENGTH: 7
      SHORT_CODE_MAX_RETRIES: 5
      REDIRECT_STATUS: 302
      REDIRECT_CACHE_ENABLED: "true"
      REDIRECT_CACHE_TTL: 10m
      REDIRECT_CACHE_ACCESS_WORKERS: 2
      REDIRECT_CACHE_ACCESS_QUEUE_SIZE: 1024
      REDIRECT_CACHE_ACCESS_TIMEOUT: 5s
      ANALYTICS_WORKERS: 2
      ANALYTICS_QUEUE_SIZE: 4096
      ANALYTICS_WRITE_TIMEOUT: 5s
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?set AUTH_TOKEN_SECRET in .env}
      AUTH_TOKEN_ISSUER: url-shortener
      AUTH_TOKEN_AUDIENCE: url-shortener-api
      AUTH_TOKEN_TTL: 15m
      AUTH_REFRESH_TOKEN_TTL: 720h
      LOG_LEVEL: info
      LOG_FORMAT: json
      REQUEST_TIMEOUT: 10s
      MAX_REQUEST_BODY_BYTES: 1048576
      SHUTDOWN_TIMEOUT: 10s

  mongodb:
    image: mongo:7.0
    container_name: url-shortener-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: url_shortener
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: url-shortener-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  mongodb_data:
