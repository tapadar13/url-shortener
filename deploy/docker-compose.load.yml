name: url-shortener-load

services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOAD_API_PORT:-18081}:8080"
    environment:
      APP_ENV: test
      HTTP_ADDR: :8080
      BASE_URL: http://api:8080
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: url_shortener_load
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: url-shortener-load
      REDIRECT_CACHE_ENABLED: "true"
      RATE_LIMIT_REQUESTS: "0"
      AUTH_TOKEN_SECRET: load-test-auth-token-secret-at-least-32-characters
      LOG_LEVEL: error
      LOG_FORMAT: text

  mongodb:
    image: mongo:7.0
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  k6:
    image: grafana/k6:2.1.0
    profiles: ["load"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8080
    volumes:
      - ../tests/load:/scripts:ro
    working_dir: /scripts
